# TRACKED TEST FIXTURE -- the TankSpec defaults, round numbers, not a real project.
# Pinned to tests/golden/example.s2k (changing it fails the golden test). Real configs
# live beside it and are gitignored (configs/* except this file); never edit this one
# toward a real tank -- copy it.
#     python build_tank.py configs/example.toml
# Units are kip, ft, F throughout.

[geometry]
radius    = 30.0        # ft, to the shell mid-surface
height    = 40.0        # ft, wall height; optional when [[courses]] is given (= their sum)

# Plate courses, bottom first. Each is a height range at one thickness; a mesh ring
# lands on every course boundary and COURSE_nn groups follow these, not the mesh rows.
# A single-thickness wall can instead give geometry.thickness (not both).
[[courses]]
height    = 20.0        # ft
thickness = 0.0208333   # ft = 0.25 in
[[courses]]
height    = 20.0
thickness = 0.015625    # ft = 3/16 in
# divisions = 10        # optional: mesh rows in this course (default: mesh.n_z shared by height)

[mesh]
n_theta = 36            # circumferential divisions
n_z     = 20            # vertical divisions in total, shared out to the courses by height

[fluid]
unit_weight   = 0.0624  # kip/ft^3, water
fill_fraction = 1.0     # 1.0 = filled to the top of the wall
load_mode     = "uniform"   # "uniform" = surface pressure per shell; "joints" = equivalent radial joint forces

[baseplate]
enabled   = true
thickness = 0.0208333   # ft = 1/4 in
n_r       = 6           # radial rings of elements; the innermost is a triangle fan

[roof]
enabled      = true
crown_radius = 48.0     # ft, spherical radius (>= geometry.radius); 0.8 D here
thickness    = 0.0208333
n_r          = 6
ring          = true    # eave compression ring: (2) equal-leg angles back to back as a Z
ring_leg      = 0.25    # ft = 3 in
ring_thickness = 0.03125 # ft = 3/8 in

[foundation]
mode             = "gap"  # "fixed" = interior held in U3 (linear); "gap" = fixed ground joints +
                          # compression-only links under the plate, nonlinear cases NL_DEAD -> NL_HYDRO
subgrade_modulus = 100.0  # kip/ft^3; link k = this x the joint's tributary plan area

[ringwall]
enabled     = true      # concrete ring under the shell on the rim's ground joints (needs foundation "gap")
width       = 1.0       # ft, radial
depth       = 3.0       # ft, vertical
fc          = 3000.0    # psi
unit_weight = 0.150     # kip/ft^3
support     = "gap"     # "gap": soil gap link under the wall, k = subgrade_modulus x width x arc | "fixed"
joints      = "elevations"  # rim joint at the wall top, wall joint at the centroid (-depth/2), ground joint at the
                        # base (-depth), links with length; nothing coincident. "top": all three at the wall top,
                        # insertion point 8 (section drawn hanging below) -- the pre-2026-09-08 layout
transform   = false     # SAP insertion "Transform": false = section drawn hanging below the wall-top joint,
                        # analysis on the joint line; true = rigid arms joint -> centroid (top push rolls the ring)

# Wall imperfections: joints move radially inward, mesh unchanged. cos^2 bell over an
# elliptical footprint. Group DENT_nn per dent.
[[dents]]
angle_deg = 0.0
elevation = 20.0
depth     = 0.1         # ft inward
width     = 8.0         # ft along the circumference
height    = 6.0         # ft up the wall

[settlement]
profile       = "trench"   # "none" | "trench": parabolic cross-section, ground displacement on the ground joints
depth         = 0.25       # ft at the trench centreline (down)
width         = 12.0       # ft; zero settlement at +/- width/2
direction_deg = 0.0        # trench axis in plan, from +X
offset        = 0.0        # ft, axis offset from the tank centre (+90 deg side)

[supports]
base_local_axes = true  # base joint local axes: X tangential, Y radial outward
release_radial  = true  # free the radial direction so the wall goes into hoop (needs base_local_axes)

[groups]
enabled = true          # SAP GROUPS: WALL, BASE_RING, TOP_RING (-> sidecar groups via SapToPluto)
courses = true          # plus COURSE_01.. per plate course

[material]
name        = "A36"
e           = 4176000.0 # kip/ft^2 = 29000 ksi
poisson     = 0.3
unit_weight = 0.490     # kip/ft^3
alpha       = 6.5e-06   # 1/degF

[output]
dir  = "../models"      # relative to this config file; models/ is gitignored
name = "example"
