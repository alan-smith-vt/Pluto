# TRACKED TEST FIXTURE (generic dimensions). Do NOT edit this toward a real tank --
# copy it to a new file under configs/ (gitignored) instead. tank_hoop.toml is pinned
# to tests/golden/tank_hoop.s2k: changing it fails the golden test.
# Cylindrical steel tank -- pinned base (baseline model).
# Units are kip, ft, F throughout.  Build with:
#     python3 sap/build_tank.py configs/tank.toml

[geometry]
radius    = 30.0        # ft, to the shell mid-surface
height    = 40.0        # ft, wall height
thickness = 0.0208333   # ft = 0.25 in.  PLACEHOLDER: gives ~25 ksi hoop at the
                        # base, most of the way to A36 yield.  Set a real
                        # thickness before drawing conclusions.

[mesh]
n_theta = 36            # radial (circumferential) divisions
n_z     = 20            # vertical divisions

[fluid]
unit_weight   = 0.0624  # kip/ft^3, water
fill_fraction = 1.0     # 1.0 = filled to the top of the wall
load_mode     = "uniform"   # "uniform" = surface pressure per shell.
                            # "joints"  = statically equivalent radial joint
                            #             forces (fallback; same global
                            #             response, no distributed load).

[supports]
base_local_axes = false # rotate base joint local axes: X tangential, Y radial out
release_radial  = false # free the radial direction so the wall goes into hoop.
                        # Requires base_local_axes = true.

[material]
name        = "A36"
e           = 4176000.0 # kip/ft^2 = 29000 ksi
poisson     = 0.3
unit_weight = 0.490     # kip/ft^3
alpha       = 6.5e-06

[output]
dir  = "../models"   # relative to this config file
name = "tank"
# The model is written to <dir>/<name>/<name>.s2k -- its own folder, because
# SAP scatters .sdb/.msh/.Y_*/.LOG working files beside whatever it opens.
