<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEA Binary Inspector</title>
<style>
  :root { color-scheme: light; }
  body {
    font: 13px/1.45 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 18px 22px; color: #1c2330; background: #f4f6f9;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  h1 .sub { font-size: 12px; font-weight: 400; color: #6b7686; margin-left: 6px; }
  .tagline { color: #6b7686; margin: 0 0 14px; }
  #controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    background: #fff; border: 1px solid #d9dee6; border-radius: 7px;
    padding: 11px 13px; margin-bottom: 12px;
  }
  button, .filebtn {
    font: inherit; border: 1px solid #b7c0cd; background: #fff; color: #1c2330;
    border-radius: 5px; padding: 5px 11px; cursor: pointer;
  }
  button:hover, .filebtn:hover { background: #eef1f5; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary, .filebtn.primary {
    background: #2f6df0; border-color: #2f6df0; color: #fff;
  }
  button.primary:hover, .filebtn.primary:hover { background: #245bce; }
  .filebtn { display: inline-block; }
  .filebtn input { display: none; }
  .fname { color: #6b7686; margin-left: auto; }
  #log {
    background: #1d2330; color: #cfe3ff; border-radius: 6px;
    padding: 9px 12px; margin: 0 0 12px; white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; max-height: 150px; overflow: auto;
  }
  #log:empty { display: none; }
  .section {
    background: #fff; border: 1px solid #d9dee6; border-radius: 7px;
    margin-bottom: 10px;
  }
  .section > summary {
    cursor: pointer; padding: 9px 13px; font-weight: 600; font-size: 13px;
    list-style: none; user-select: none;
  }
  .section > summary::-webkit-details-marker { display: none; }
  .section > summary::before { content: "\25B8 "; color: #8a94a3; }
  .section[open] > summary::before { content: "\25BE "; }
  .sbody { padding: 4px 13px 13px; }
  .subhdr {
    font-weight: 600; color: #44506a; margin: 13px 0 5px; font-size: 12px;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .subhdr:first-child { margin-top: 5px; }
  .note { color: #6b7686; margin: 7px 0; }
  .tablewrap { overflow-x: auto; }
  table.grid { border-collapse: collapse; font-size: 12px; }
  table.grid th, table.grid td {
    border: 1px solid #e2e6ec; padding: 3px 8px; text-align: left;
    white-space: nowrap;
  }
  table.grid th { background: #eef1f5; color: #44506a; }
  table.grid tbody tr:nth-child(even) { background: #f8f9fb; }
  td.num, td.nan { font-family: ui-monospace, Menlo, Consolas, monospace; text-align: right; }
  td.nan { color: #b22; background: #fdeceb; }
  td.pad { color: #9aa3b1; font-style: italic; }
  td.ok { color: #137a37; font-weight: 600; }
  td.bad { color: #c0271a; font-weight: 600; }
  td.kind-stress       { background: #eef3fb; color: #1f3a73; }
  td.kind-displacement { background: #eef7ee; color: #1a5a32; }
  td.kind-dsr          { background: #fbf2e6; color: #8a4b00; font-weight: 600; }
  td.kind-str     { background: #f3ecf9; color: #5a2d82; }
  pre.hex {
    background: #f6f7f9; border: 1px solid #e2e6ec; border-radius: 5px;
    padding: 8px 10px; overflow-x: auto; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 4px 0;
  }
  .pgbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
  .pginfo { color: #6b7686; margin-left: 6px; }
  .pgjump { width: 92px; font: inherit; padding: 3px 6px;
            border: 1px solid #b7c0cd; border-radius: 4px; }
  .fctl { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .sel { font: inherit; padding: 3px 6px; border: 1px solid #b7c0cd; border-radius: 4px; }
  .errbox {
    background: #fdeceb; border: 1px solid #f0b6b1; color: #a3261b;
    border-radius: 6px; padding: 10px 13px;
  }
</style>
</head>
<body>

<h1>FEA Binary Inspector <span class="sub">FEAV v3 format</span></h1>
<p class="tagline">Parse and inspect every field of a stress-viewer binary file.</p>

<div id="controls">
  <label class="filebtn primary">Open .bin file
    <input type="file" id="insFile" accept=".bin,.feabin,.dat,.rbnl,application/octet-stream">
  </label>
  <button id="btnSample">Inspect Sample Model</button>
  <button id="btnDownload">Download Sample .bin</button>
  <span id="fileName" class="fname">No file loaded.</span>
</div>

<pre id="log"></pre>
<div id="results"></div>

<!-- Reuse the viewer's reader + sample generator -- no duplicated format logic. -->
<script src="scripts/format/v3Reader.js"></script>
<script>var FEABinary = FEAv3; /* inspector is a v3-only tool for now */</script>
<script src="scripts/sampleModel.js"></script>
<script src="scripts/inspector.js"></script>

</body>
</html>
