<div id="info"></div>
<div id="controls">
	<input type="file" id="fileInput" accept=".bnl">
	<br><br>
	<div id="sliderLayout">
	<!-- row 1 -->
	<label for="clipPct">Clip %:</label>
	<input 
		type="range" 
		id="clipPct" 
		min="1" 
		max="100" 
		step="1" 
		value="100"
	>
	<span id="clipLabel">100%</span>
	<br>
	<!-- row 2 -->
	<label for="dispScale">Animate:</label>
	<input 
		type="range" 
		id="dispScale" 
		min="-300.0" 
		max="300.0" 
		step="0.1" 
		value="0.0"
	>
	<span id="dispLabel">0x</span>
	<input type="number", id="sliderMax", value = "300" step = "10">
	<!-- &#9208 for the pause button -->
	<!-- hardcode play button icon because powershell mangles UTF-8 -->
	<button id="playBtn">&#9654</button>
	<br><br>
	</div>
	<label>File: <select id="modelSelect"></select></label>
	<label>LC: <select id="lcSelect"></select></label>
	<label>Component: <select id="compSelect">
		<option value="5">Mx</option><option value="7">My</option>
		<option value="6">Mxy</option><option value="0">Sx (Axial)</option>
		<option value="3">Sy (Axial)</option><option value="1">Sxy (IP)</option>
		<option value="2">SQx (OOP)</option><option value="4">SQy (OOP)</option>
		<option value="8">XTr</option><option value="9">YTr</option>
		<option value="10">ZTr</option><option value="11">XRot</option>
		<option value="12">YRot</option><option value="13">ZRot</option>
	</select></label><br>
</div>

<!-- SECTION CUT UI -->
<!-- &#9986 for the scissors icon -->
<div id="sectionCutTab">&#9986;</div>
<div id="sectionCutPanel" class="collapsed">
	<div id="sectionCutControls">
		<div style="font-size:12px; color:#8888aa; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">
		Section Cuts</div>
		
		<div style="display:flex; gap:5px; margin-bottom:10px;">
			<button id="btnNewCut" class="sc-btn">New Cut</button>
			<button id="btnAdjust" class="sc-btn" disabled>Adjust</button>
			<button id="btnDelete" class="sc-btn sc-btn-danger" disabled>Delete</button>
		</div>
		
		<div class="sc-field-row">
			<span class="sc-label">Name</span>
			<input type="text" id="cutName" class="sc-input" disabled>
		</div>
		
		<div class="sc-field-row">
			<span class="sc-label">Group</span>
			<select type="text" id="cutGroup" class="sc-select" disabled>
				<option value="">Ungrouped</option>
				<option value="__new__">+ New group...</option>
			</select>
		</div>
		
		<div class="sc-field-row">
			<span class="sc-label">Axis</span>
			<div style="display:flex; gap:3px;">
				<button class="sc-axis-btn" data-axis="X" disabled>X</button>
				<button class="sc-axis-btn" data-axis="Y" disabled>Y</button>
				<button class="sc-axis-btn active" data-axis="Z" disabled>Z</button>
			</div>
			<span class="sc-label" style="margin-left:auto;">Length</span>
			<input type="number" id="cutLengthFt" class="sc-input" style="width:45px; text-align:center;" value="10" min="0.1"
			step="0.1" disabled>
			<span style="font-size:10px; color:#666;">ft</span>
		</div>

		<div class="sc-position-block">
			<div style="font-size:9px; color:#666; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px;">
			Position (inches)</div>
			<div class="sc-pos-row">
				<span class="sc-pos-label" style="color:#ff4444;">X</span>
				<input type="text" id="cutPosX" class="sc-pos-input" disabled>
			</div>
			<div class="sc-pos-row">
				<span class="sc-pos-label" style="color:#44ff44;">Y</span>
				<input type="text" id="cutPosY" class="sc-pos-input" disabled>
			</div>
			<div class="sc-pos-row">
				<span class="sc-pos-label" style="color:#4488ff;">Z</span>
				<input type="text" id="cutPosZ" class="sc-pos-input" disabled>
			</div>
		</div>
		
		<div style="display:flex; gap:5px; margin-top:8px;">
			<button = class="sc-btn sc-btn-secondary" id="btnExport">Export All</button>
			<button = class="sc-btn sc-btn-secondary" id="btnImport">Import</button>
			<input type="file" id="importFile" accept=".json" style="display:none;">
		</div>
	</div>
	
	<div id="cutList"></div>
</div>
