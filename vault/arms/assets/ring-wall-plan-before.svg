<svg font-family="Consolas, Menlo, monospace" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="Plan view, today: each ring wall joint pinned in X and Y; radial movement blocked; hoop force zero." >
      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker>
      </defs>
      <rect x="0" y="0" width="400" height="330" fill="#ffffff"/>
      <text x="16" y="24" font-size="12" fill="#b4472b" font-weight="500">BEFORE — U1 = U2 = Yes (global)</text>
      <!-- ring arc -->
      <path d="M40 300 A 200 200 0 0 1 360 300" fill="none" stroke="#1f2328" stroke-width="8" stroke-opacity=".25"/>
      <path d="M40 300 A 200 200 0 0 1 360 300" fill="none" stroke="#1f2328" stroke-width="1.2"/>
      <!-- centre mark -->
      <line x1="196" y1="296" x2="204" y2="304" stroke="#1f2328"/><line x1="204" y1="296" x2="196" y2="304" stroke="#1f2328"/>
      <text x="212" y="304" font-size="11" fill="#6b7380">tank centre</text>
      <!-- joints with X/Y pins -->
      <g stroke="#b4472b" fill="#b4472b">
        <!-- joint at top -->
        <circle cx="200" cy="100" r="4"/>
        <path d="M200 100 l-7 12 h14 z" fill="none"/><path d="M200 100 l-12 -7 v14 z" fill="none"/>
        <!-- joint left -->
        <circle cx="86" cy="164" r="4"/>
        <path d="M86 164 l-7 12 h14 z" fill="none"/><path d="M86 164 l-12 -7 v14 z" fill="none"/>
        <!-- joint right -->
        <circle cx="314" cy="164" r="4"/>
        <path d="M314 164 l-7 12 h14 z" fill="none"/><path d="M314 164 l-12 -7 v14 z" fill="none"/>
      </g>
      <text x="200" y="88" font-size="11" text-anchor="middle" fill="#b4472b">pinned X and Y</text>
      <!-- blocked radial arrow -->
      <line x1="200" y1="100" x2="200" y2="52" stroke="#b4472b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a1)" style="color: #b4472b"/>
      <line x1="188" y1="60" x2="212" y2="72" stroke="#b4472b" stroke-width="2"/>
      <text x="220" y="62" font-size="11" fill="#b4472b">radial: blocked</text>
      <!-- hoop label -->
      <text x="200" y="210" font-size="12" text-anchor="middle">hoop N = 0</text>
      <text x="200" y="226" font-size="11" text-anchor="middle" fill="#6b7380">restraints take any radial load</text>
    </svg>