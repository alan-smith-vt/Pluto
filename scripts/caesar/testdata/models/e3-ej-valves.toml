# expansion joints with valves and flanges: a tied (control-rod) joint, an untied one, valves either side, a gimbal-like joint
[model]
title = "E3 joints and valves"
material = 106
[defaults]
section = "12in"
delta_t = 300
pressure = 150
bend = "LR"
max_length = 10
[sections.12in]
nps = 12
schedule = "STD"
fluid_sg = 0.8
[parameters]
ej = 20
[[runs]]
name = "line"
start = [0, 0, 0]
legs = [["+X", 50], ["+Y", 10], ["+X", 20]]
[[components]]
type = "flanged_valve"
name = "V-1"
run = "line"
at = 5
length = 2
weight = 900
[[components]]
type = "flange_pair"
run = "line"
at = "ej - 1"
length = 0.5
weight = 200
[[components]]
type = "expansion_joint"
name = "EJ-TIED"
run = "line"
at = "ej"
length = 2
axial_stiffness = 2000
transverse_stiffness = 8000
effective_id = 13.5
[[components]]
type = "flange_pair"
run = "line"
at = "ej + 2.5"
length = 0.5
weight = 200
[[components]]
type = "valve"
name = "V-2"
run = "line"
at = 30
length = 1.5
weight = 600
[[components]]
type = "expansion_joint"
name = "EJ-FREE"
run = "line"
at = 40
length = 1.5
axial_stiffness = 1500
bending_stiffness = 500
torsion_stiffness = 1e6
effective_id = 13.5
# control rods across EJ-TIED: an axial tie with a gap between the flanges either side. A CNODE is the same point as its node
# to CAESAR (44E when the pipe puts them apart), so the rods are stubs: a weightless rigid lug up from the upstream flange
# and the rod along the joint, a lug up from the downstream flange, and the tie where the two meet
[[runs]]
name = "rod1"
from = { run = "line", at = "ej - 1" }
tee = "none"
legs = [{ dir = "+Y", length = 1, bend = "none" }, ["+X", 4]]
[[runs]]
name = "lug1"
from = { run = "line", at = "ej + 3" }
tee = "none"
legs = [["+Y", 1]]
[[components]]
type = "rigid"
run = "rod1"
at = 0
length = 1
weight = 0
[[components]]
type = "rigid"
run = "rod1"
at = 1
length = 4
weight = 0
[[components]]
type = "rigid"
run = "lug1"
at = 0
length = 1
weight = 0
[[ties]]
node = { run = "rod1", at = "L" }
cnode = { run = "lug1", at = "L" }
type = "X"
gap = 0.5
tag = "ROD-1"
[[supports]]
run = "line"
at = [0, "L"]
type = "ANC"
[[supports]]
run = "line"
at = [12, 26, 35, 46]
type = ["+Y", "GUI"]
mu = 0.3
# control rods across EJ-FREE that act only in extension: a one-way CNODE restraint with the rods' free play, on stubs as
# above (the rod from the upstream side, the lug on the downstream side, the node on the downstream side as before)
[[runs]]
name = "rod2"
from = { run = "line", at = 39 }
tee = "none"
legs = [{ dir = "+Y", length = 1, bend = "none" }, ["+X", 3]]
[[runs]]
name = "lug2"
from = { run = "line", at = 42 }
tee = "none"
legs = [["+Y", 1]]
[[components]]
type = "rigid"
run = "rod2"
at = 0
length = 1
weight = 0
[[components]]
type = "rigid"
run = "rod2"
at = 1
length = 3
weight = 0
[[components]]
type = "rigid"
run = "lug2"
at = 0
length = 1
weight = 0
[[ties]]
node = { run = "lug2", at = "L" }
cnode = { run = "rod2", at = "L" }
type = "-X"
gap = 0.375
tag = "CONTROL-RODS"
